name: consumers-smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "consumers/**"
      - ".github/workflows/consumers-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: consumers
    env:
      AWS_REGION: us-east-1
      GLUE_DATABASE: lkc-q2zqngd
      GLUE_TABLE: orders.clean
      DELTA_TABLE_URI: ${{ vars.DELTA_TABLE_URI }}
      # Tolerance = the largest single Tableflow commit observed (docs/09 Q4: 3,445 rows in the
      # first data file; ~1,000 rows per 5-minute window at demo rate). Iceberg and Delta share
      # data files and commit together, so a gap only appears between the two commits of one batch.
      COUNT_TOLERANCE: "3500"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "17"
      - run: pip install -q -r consumers/requirements.txt
      # OIDC → github-actions-consumers (environment:consumers), which may assume only the two
      # consumer roles. No Terraform role, no Confluent anything.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CONSUMERS_ROLE_ARN }}
          aws-region: us-east-1
      - name: isolation grep
        run: bash consumers/check-isolation.sh
      - name: iceberg via Glue (consumer-iceberg)
        id: ice
        env:
          ROLE: ${{ vars.AWS_CONSUMER_ICEBERG_ROLE_ARN }}
        run: |
          set -euo pipefail
          out=$(aws sts assume-role --role-arn "$ROLE" --role-session-name smoke-iceberg --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          export AWS_ACCESS_KEY_ID=$(cut -f1 <<<"$out") AWS_SECRET_ACCESS_KEY=$(cut -f2 <<<"$out") AWS_SESSION_TOKEN=$(cut -f3 <<<"$out")
          python consumers/iceberg/pyiceberg_read.py | tail -8
          echo "count=$(python consumers/iceberg/pyiceberg_read.py --count-only)" >> "$GITHUB_OUTPUT"
          echo "snapshot=$(python consumers/iceberg/pyiceberg_read.py --snapshot-only)" >> "$GITHUB_OUTPUT"
      - name: delta by path, Spark (consumer-delta)
        id: delta
        env:
          ROLE: ${{ vars.AWS_CONSUMER_DELTA_ROLE_ARN }}
        run: |
          set -euo pipefail
          out=$(aws sts assume-role --role-arn "$ROLE" --role-session-name smoke-delta --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          export AWS_ACCESS_KEY_ID=$(cut -f1 <<<"$out") AWS_SECRET_ACCESS_KEY=$(cut -f2 <<<"$out") AWS_SESSION_TOKEN=$(cut -f3 <<<"$out")
          python consumers/delta/spark_read.py 2>/dev/null | grep -vE 'WARN|^\s*$' | tail -12
          echo "count=$(python consumers/delta/spark_read.py --count-only 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
          echo "version=$(python consumers/delta/spark_read.py --version-only 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
      - name: assert
        env:
          ICE: ${{ steps.ice.outputs.count }}
          DEL: ${{ steps.delta.outputs.count }}
        run: |
          set -euo pipefail
          echo "iceberg rows=$ICE snapshot=${{ steps.ice.outputs.snapshot }}"
          echo "delta   rows=$DEL version=${{ steps.delta.outputs.version }}"
          [[ "$ICE" -gt 0 && "$DEL" -gt 0 ]] || { echo "a consumer returned zero rows"; exit 1; }
          diff=$(( ICE > DEL ? ICE - DEL : DEL - ICE ))
          [[ "$diff" -le "$COUNT_TOLERANCE" ]] || { echo "counts differ by $diff > $COUNT_TOLERANCE"; exit 1; }
          echo "ok: counts agree within $COUNT_TOLERANCE (diff $diff)"

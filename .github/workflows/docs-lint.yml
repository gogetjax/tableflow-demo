name: docs-lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yml"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24

  mermaid:
    # @mermaid-js/mermaid-cli has no standalone --validate flag (checked against
    # v11.17.0 `mmdc --help`). Rendering a Markdown file with -i extracts every
    # ```mermaid block and exits non-zero on a parse error, which is the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install mermaid-cli
        run: npm install --no-save @mermaid-js/mermaid-cli@11
      - name: Render every Mermaid block in tracked Markdown
        run: |
          set -euo pipefail
          echo '{ "args": ["--no-sandbox", "--disable-setuid-sandbox"] }' > /tmp/puppeteer.json
          mkdir -p /tmp/mmdc-out
          status=0
          while IFS= read -r f; do
            grep -q '```mermaid' "$f" || continue
            out="/tmp/mmdc-out/$(echo "$f" | tr '/' '_')"
            echo "== $f"
            if ! npx mmdc -q -p /tmp/puppeteer.json -i "$f" -o "$out"; then
              echo "::error file=$f::Mermaid block failed to render"
              status=1
            fi
          done < <(git ls-files '*.md')
          exit $status
